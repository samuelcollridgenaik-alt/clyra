name: Clyra verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clyra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLYRA_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/clyra_ci_test?replicaSet=clyra-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name clyra-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet clyra-ci --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec clyra-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec clyra-mongo mongosh --quiet --eval 'rs.initiate({_id:"clyra-ci",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec clyra-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Syntax checks
        run: npm run check
      - name: State-machine tests
        run: npm test
      - name: End-to-end API and MongoDB lifecycle
        run: npm run test:integration

  web:
    name: React production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Client regression tests
        run: npm test
      - name: Release configuration regression tests
        run: node --test ../scripts/tests/*.test.mjs
      - name: Build web app
        run: npm run build
      - name: Attach production web build
        uses: actions/upload-artifact@v4
        with:
          name: clyra-web-build
          path: web/dist
          if-no-files-found: error
          retention-days: 14

  flutter:
    name: Flutter analyze, test and Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
      - name: Generate missing Android platform files
        run: node ../scripts/prepare-android.mjs
      - name: Install Flutter packages
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:4001/api/v1
      - name: Attach Android APK to workflow
        uses: actions/upload-artifact@v4
        with:
          name: clyra-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
